<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Focus Timer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
height:100vh;
background:url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=2070') center/cover;
display:flex;
justify-content:center;
align-items:center;
color:white;
overflow-y:auto;
padding:40px 0;
position:relative;
transition:background .6s ease;
}

body::before{
content:'';
position:fixed;
inset:0;
background:rgba(0,0,0,.25);
backdrop-filter:blur(8px);
z-index:-1;
}

/* APP */

.app{
width:90%;
max-width:950px;
text-align:center;
opacity:0;
pointer-events:none;
transition:.6s ease;
}

.app.show{
opacity:1;
pointer-events:auto;
}

/* INTENTION SCREEN */

.intention-screen{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
backdrop-filter:blur(16px);
display:flex;
justify-content:center;
align-items:center;
z-index:1000;
}

.intention-card{
width:90%;
max-width:560px;
padding:50px 40px;
border-radius:32px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.2);
backdrop-filter:blur(20px);
text-align:center;
box-shadow:0 25px 60px rgba(0,0,0,.45);
animation:fadeUp .6s ease;
}

.intention-card h1{
font-size:44px;
margin-bottom:12px;
}

.intention-card p{
font-size:16px;
line-height:1.7;
color:rgba(255,255,255,.82);
margin-bottom:35px;
}

.intention-options{
display:flex;
flex-direction:column;
gap:15px;
}

.intention-options button{
padding:18px;
border:none;
border-radius:24px;
background:white;
color:black;
font-size:18px;
font-weight:700;
cursor:pointer;
transition:.25s;
}

.intention-options button:hover{
transform:translateY(-2px) scale(1.02);
}

/* PREP SCREEN */

.prep-screen{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.55);
backdrop-filter:blur(16px);
z-index:999;
}

.prep-card{
width:90%;
max-width:520px;
padding:50px 40px;
border-radius:32px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.2);
backdrop-filter:blur(20px);
text-align:center;
box-shadow:0 25px 60px rgba(0,0,0,.45);
animation:fadeUp .5s ease;
}

.prep-label{
font-size:18px;
color:rgba(255,255,255,.75);
margin-bottom:10px;
}

.prep-task{
font-size:38px;
font-weight:700;
margin-bottom:30px;
}

.prep-timer{
font-size:90px;
font-weight:700;
margin-bottom:25px;
}

.skip-btn{
padding:14px 30px;
border:none;
border-radius:30px;
background:white;
color:black;
font-weight:700;
cursor:pointer;
}

/* MODES */

.modes{
display:flex;
justify-content:center;
gap:18px;
margin-bottom:35px;
flex-wrap:wrap;
}

.mode-btn{
padding:12px 28px;
border-radius:40px;
border:2px solid rgba(255,255,255,.35);
background:rgba(255,255,255,.06);
color:white;
font-weight:600;
cursor:pointer;
transition:.25s;
}

.mode-btn.active{
background:white;
color:black;
}

/* TIMER */

.timer{
font-size:120px;
font-weight:700;
margin-bottom:25px;
}

/* CONTROLS */

.controls{
display:flex;
justify-content:center;
gap:15px;
margin-bottom:35px;
flex-wrap:wrap;
}

.control-btn{
padding:16px 50px;
border:none;
border-radius:50px;
background:white;
color:black;
font-size:20px;
font-weight:700;
cursor:pointer;
}

.icon-btn{
padding:10px 14px;
border:none;
border-radius:50%;
background:rgba(255,255,255,.15);
color:white;
font-size:18px;
cursor:pointer;
}

/* SPOTIFY */

.spotify-panel{
margin-top:20px;
padding:26px;
border-radius:28px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.18);
backdrop-filter:blur(20px);
display:none;
box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.spotify-loader{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
}

.playlist-input{
width:60%;
padding:14px 18px;
border:none;
outline:none;
border-radius:30px;
font-size:14px;
}

.load-btn{
padding:14px 24px;
border:none;
border-radius:30px;
background:#1DB954;
color:white;
font-weight:700;
cursor:pointer;
}

.spotify-player{
margin-top:18px;
}

/* WATER TRACKER */

.water-widget{
margin-top:30px;
padding:24px;
border-radius:28px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.18);
box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.water-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
text-align:left;
}

.water-top h3{
font-size:24px;
margin-bottom:4px;
}

.water-top p{
font-size:14px;
color:rgba(255,255,255,.75);
}

.water-count{
font-size:18px;
font-weight:700;
}

.cups{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
margin-bottom:22px;
}

.cup{
height:70px;
border-radius:18px;
border:2px solid rgba(255,255,255,.4);
background:rgba(255,255,255,.05);
transition:.3s ease;
}

.cup.filled{
background:rgba(120,190,255,.95);
transform:translateY(-3px);
box-shadow:0 10px 25px rgba(120,190,255,.35);
}

.water-btn{
width:100%;
padding:16px;
border:none;
border-radius:20px;
background:white;
color:black;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:.25s;
}

.water-btn:hover{
transform:scale(1.02);
}

/* FOOTER */

.footer-note{
position:fixed;
bottom:16px;
left:50%;
transform:translateX(-50%);
font-size:14px;
color:rgba(255,255,255,.8);
pointer-events:none;
}

/* ANIMATION */

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* MOBILE */

@media(max-width:700px){

.timer{
font-size:80px;
}

.prep-timer{
font-size:64px;
}

.playlist-input{
width:100%;
}

.water-top{
flex-direction:column;
align-items:flex-start;
gap:10px;
}

.cup{
height:55px;
}

.intention-card h1{
font-size:34px;
}

}

</style>
</head>

<body>

<!-- INTENTION -->

<div class="intention-screen" id="intentionScreen">

<div class="intention-card">

<h1>Set your intention</h1>

<p>
Before you begin, take a moment to reset your space and mind.
</p>

<div class="intention-options">

<button onclick="startPreparation('📝 Plan')">
📝 Plan
</button>

<button onclick="startPreparation('🧹 Clean')">
🧹 Clean
</button>

<button onclick="startPreparation('🥤 Snack or Drink')">
🥤 Snack or Drink
</button>

</div>

</div>

</div>

<!-- PREP -->

<div class="prep-screen" id="prepScreen">

<div class="prep-card">

<div class="prep-label">
Preparation Time
</div>

<div class="prep-task" id="prepTask">
📝 Plan
</div>

<div class="prep-timer" id="prepTimer">
05:00
</div>

<button class="skip-btn" onclick="enterApp()">
Skip
</button>

</div>

</div>

<!-- APP -->

<div class="app" id="app">

<!-- MODES -->

<div class="modes">

<button class="mode-btn active" onclick="setMode('pomodoro',60,this)">
Deep Focus
</button>

<button class="mode-btn" onclick="setMode('short',5,this)">
Short Break
</button>

<button class="mode-btn" onclick="setMode('long',15,this)">
Long Break
</button>

</div>

<!-- TIMER -->

<div class="timer" id="timer">
60:00
</div>

<!-- CONTROLS -->

<div class="controls">

<button class="control-btn" onclick="toggleTimer()" id="startPause">
Start
</button>

<button class="icon-btn" onclick="resetTimer()">
⟳
</button>

<button class="icon-btn" onclick="toggleMusic()">
🎵
</button>

</div>

<!-- SPOTIFY -->

<div class="spotify-panel" id="spotifyPanel">

<div class="spotify-loader">

<input
id="playlistInput"
class="playlist-input"
placeholder="Paste Spotify playlist link">

<button class="load-btn" onclick="loadPlaylist()">
Load Playlist
</button>

</div>

<div class="spotify-player">

<iframe
id="spotifyPlayer"
src=""
width="100%"
height="160"
frameborder="0"
allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
</iframe>

</div>

</div>

<!-- WATER TRACKER -->

<div class="water-widget">

<div class="water-top">

<div>
<h3>Hydration</h3>
<p>Drink water every 15 minutes 💧</p>
</div>

<div class="water-count" id="waterCount">
0 / 8 Cups
</div>

</div>

<div class="cups">

<div class="cup"></div>
<div class="cup"></div>
<div class="cup"></div>
<div class="cup"></div>
<div class="cup"></div>
<div class="cup"></div>
<div class="cup"></div>
<div class="cup"></div>

</div>

<button class="water-btn" onclick="addCup()">
+ Add Cup
</button>

</div>

</div>

<!-- FOOTER -->

<div class="footer-note">
made by sid for rey, happy 19 rey. 💜
</div>

<script>

/* MAIN TIMER */

let defaultTime = 60 * 60
let time = defaultTime
let timerInterval = null
let running = false

function updateDisplay(){

let minutes = Math.floor(time / 60)
let seconds = time % 60

document.getElementById("timer").innerText =
`${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`

}

function toggleTimer(){

if(running){

clearInterval(timerInterval)
running = false
document.getElementById("startPause").innerText = "Start"

}else{

timerInterval = setInterval(()=>{

if(time > 0){

time--
updateDisplay()

}else{

clearInterval(timerInterval)
running = false

document.getElementById("startPause").innerText = "Start"

alert("Session complete 🎉")

}

},1000)

running = true
document.getElementById("startPause").innerText = "Pause"

}

}

function resetTimer(){

clearInterval(timerInterval)

timerInterval = null
running = false

time = defaultTime

updateDisplay()

document.getElementById("startPause").innerText = "Start"

}

updateDisplay()

/* BACKGROUNDS */

const backgrounds = {

pomodoro:"url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=2070')",

short:"url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=2070')",

long:"url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2070')"

}

function setMode(mode,minutes,btn){

document.querySelectorAll(".mode-btn")
.forEach(b=>b.classList.remove("active"))

btn.classList.add("active")

defaultTime = minutes * 60

resetTimer()

document.body.style.backgroundImage = backgrounds[mode]

}

/* MUSIC */

let musicOpen = false

function toggleMusic(){

const panel = document.getElementById("spotifyPanel")

if(musicOpen){

panel.style.display = "none"
musicOpen = false

}else{

panel.style.display = "block"
musicOpen = true

}

}

/* SPOTIFY */

function loadPlaylist(){

let url = document.getElementById("playlistInput").value

if(!url.includes("spotify.com")){

alert("Paste a valid Spotify playlist link")
return

}

try{

let id = url.split("playlist/")[1].split("?")[0]

let embed =
`https://open.spotify.com/embed/playlist/${id}`

document.getElementById("spotifyPlayer").src = embed

}catch{

alert("Invalid playlist link")

}

}

/* PREPARATION */

let prepTime = 300
let prepInterval = null

function startPreparation(task){

document.getElementById("prepTask").innerText = task

document.getElementById("intentionScreen").style.display = "none"

document.getElementById("prepScreen").style.display = "flex"

prepTime = 300

updatePrepDisplay()

prepInterval = setInterval(()=>{

if(prepTime > 0){

prepTime--
updatePrepDisplay()

}else{

clearInterval(prepInterval)
enterApp()

}

},1000)

}

function updatePrepDisplay(){

let minutes = Math.floor(prepTime / 60)
let seconds = prepTime % 60

document.getElementById("prepTimer").innerText =
`${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`

}

function enterApp(){

clearInterval(prepInterval)

document.getElementById("prepScreen").style.display = "none"

document.getElementById("app").classList.add("show")

}

/* WATER TRACKER */

let cupsDrank = 0

const cups = document.querySelectorAll(".cup")

function addCup(){

if(cupsDrank >= 8){

alert("Hydration goal completed 💧")
return

}

cups[cupsDrank].classList.add("filled")

cupsDrank++

updateWaterCount()

}

function updateWaterCount(){

document.getElementById("waterCount").innerText =
`${cupsDrank} / 8 Cups`

}

/* WATER REMINDER */

setInterval(()=>{

if(running){

alert("Time to drink some water 💧")

}

},15 * 60 * 1000)

</script>

</body>
</html>

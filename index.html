<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Focus Timer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
height:100vh;
background-size:cover;
background-position:center;
transition:background .6s ease;
display:flex;
justify-content:center;
align-items:center;
color:white;
background:url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=2070") center/cover;
position:relative;
overflow:hidden;
}

/* BACKGROUND OVERLAY */

body::before{
content:"";
position:fixed;
inset:0;
backdrop-filter:blur(6px);
background:rgba(0,0,0,0.25);
z-index:-1;
}

/* MAIN APP */

.app{
text-align:center;
width:90%;
max-width:900px;
opacity:0;
pointer-events:none;
transition:.6s ease;
}

.app.show{
opacity:1;
pointer-events:auto;
}

/* INTENTION SCREEN */

.intention-screen{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
backdrop-filter:blur(14px);
display:flex;
justify-content:center;
align-items:center;
z-index:999;
transition:.5s ease;
}

.intention-card{
width:90%;
max-width:560px;
padding:50px 40px;
border-radius:32px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.2);
backdrop-filter:blur(20px);
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.45);
animation:fadeUp .6s ease;
}

.intention-card h1{
font-size:44px;
margin-bottom:15px;
}

.intention-card p{
font-size:16px;
line-height:1.7;
color:rgba(255,255,255,.82);
margin-bottom:35px;
}

.intention-options{
display:flex;
flex-direction:column;
gap:15px;
}

.intention-options button{
padding:18px;
border:none;
border-radius:22px;
background:white;
color:black;
font-size:18px;
font-weight:700;
cursor:pointer;
transition:.25s;
}

.intention-options button:hover{
transform:translateY(-2px) scale(1.02);
}

/* PREPARATION SCREEN */

.prep-screen{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.55);
backdrop-filter:blur(14px);
z-index:998;
}

.prep-card{
width:90%;
max-width:520px;
padding:50px 40px;
border-radius:32px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.2);
backdrop-filter:blur(20px);
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.45);
animation:fadeUp .5s ease;
}

.prep-label{
font-size:20px;
margin-bottom:10px;
color:rgba(255,255,255,.8);
}

.prep-task{
font-size:36px;
font-weight:700;
margin-bottom:30px;
}

.prep-timer{
font-size:80px;
font-weight:700;
margin-bottom:25px;
}

.skip-btn{
padding:14px 28px;
border:none;
border-radius:30px;
background:white;
color:black;
font-weight:700;
cursor:pointer;
}

/* MODES */

.modes{
display:flex;
justify-content:center;
gap:18px;
margin-bottom:35px;
}

.mode-btn{
padding:12px 28px;
border-radius:40px;
border:2px solid rgba(255,255,255,.4);
background:rgba(255,255,255,.05);
color:white;
font-weight:600;
cursor:pointer;
transition:.25s;
}

.mode-btn.active{
background:white;
color:black;
}

/* TIMER */

.timer{
font-size:110px;
font-weight:700;
margin-bottom:25px;
}

/* CONTROLS */

.controls{
display:flex;
justify-content:center;
gap:15px;
margin-bottom:40px;
}

.control-btn{
padding:16px 50px;
border-radius:50px;
border:none;
background:white;
color:black;
font-size:20px;
font-weight:700;
cursor:pointer;
}

.icon-btn{
font-size:18px;
padding:10px 14px;
border-radius:50%;
background:rgba(255,255,255,.15);
border:none;
color:white;
cursor:pointer;
}

/* SPOTIFY */

.spotify-panel{
margin-top:15px;
padding:26px;
border-radius:24px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.25);
box-shadow:0 25px 60px rgba(0,0,0,.6);
display:none;
}

.spotify-loader{
display:flex;
justify-content:center;
gap:10px;
}

.playlist-input{
width:60%;
padding:14px 18px;
border-radius:30px;
border:none;
outline:none;
font-size:14px;
}

.load-btn{
padding:14px 26px;
border:none;
border-radius:30px;
background:#1DB954;
color:white;
font-weight:600;
cursor:pointer;
}

.spotify-player{
margin-top:15px;
}

/* FOOTER */

.footer-note{
position:fixed;
bottom:18px;
left:50%;
transform:translateX(-50%);
font-size:14px;
font-weight:500;
color:rgba(255,255,255,0.8);
letter-spacing:0.3px;
pointer-events:none;
}

/* ANIMATIONS */

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* MOBILE */

@media(max-width:600px){

.timer{
font-size:72px;
}

.prep-timer{
font-size:60px;
}

.control-btn{
padding:14px 38px;
font-size:18px;
}

.playlist-input{
width:100%;
}

.intention-card h1{
font-size:34px;
}

}

</style>
</head>

<body>

<!-- INTENTION SCREEN -->

<div class="intention-screen" id="intentionScreen">

<div class="intention-card">

<h1>Set your intention</h1>

<p>
Before you begin, take a moment to reset your space and mind.
</p>

<div class="intention-options">

<button onclick="startPreparation('📝 Plan')">
📝 Plan
</button>

<button onclick="startPreparation('🧹 Clean')">
🧹 Clean
</button>

<button onclick="startPreparation('🥤 Snack or Drink')">
🥤 Snack or Drink
</button>

</div>

</div>

</div>

<!-- PREPARATION SCREEN -->

<div class="prep-screen" id="prepScreen">

<div class="prep-card">

<div class="prep-label">
Preparation Time
</div>

<div class="prep-task" id="prepTask">
📝 Plan
</div>

<div class="prep-timer" id="prepTimer">
05:00
</div>

<button class="skip-btn" onclick="enterApp()">
Skip
</button>

</div>

</div>

<!-- MAIN APP -->

<div class="app" id="app">

<div class="modes">

<button class="mode-btn active" onclick="setMode('pomodoro',60,this)">
Deep Focus
</button>

<button class="mode-btn" onclick="setMode('short',5,this)">
Short Break
</button>

<button class="mode-btn" onclick="setMode('long',15,this)">
Long Break
</button>

</div>

<div class="timer" id="timer">
60:00
</div>

<div class="controls">

<button class="control-btn" onclick="toggleTimer()" id="startPause">
Start
</button>

<button class="icon-btn" onclick="resetTimer()">
⟳
</button>

<button class="icon-btn" onclick="toggleMusic()">
🎵
</button>

</div>

<!-- SPOTIFY -->

<div class="spotify-panel" id="spotifyPanel">

<div class="spotify-loader">

<input
id="playlistInput"
class="playlist-input"
placeholder="Paste Spotify playlist link">

<button class="load-btn" onclick="loadPlaylist()">
Load Playlist
</button>

</div>

<div class="spotify-player">

<iframe
id="spotifyPlayer"
src=""
width="100%"
height="160"
frameborder="0"
allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
</iframe>

</div>

</div>

</div>

<!-- FOOTER -->

<div class="footer-note">
made by sid for rey, happy 19 rey. 💜
</div>

<script>

/* MAIN TIMER */

let defaultTime = 60 * 60
let time = defaultTime
let timerInterval = null
let running = false

function updateDisplay(){

let minutes = Math.floor(time / 60)
let seconds = time % 60

document.getElementById("timer").innerText =
`${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`

}

function toggleTimer(){

if(running){

clearInterval(timerInterval)
running = false
document.getElementById("startPause").innerText = "Start"

}else{

timerInterval = setInterval(()=>{

if(time > 0){

time--
updateDisplay()

}else{

clearInterval(timerInterval)
running = false
document.getElementById("startPause").innerText = "Start"

alert("Session complete 🎉")

}

},1000)

running = true
document.getElementById("startPause").innerText = "Pause"

}

}

function resetTimer(){

clearInterval(timerInterval)

timerInterval = null
running = false

time = defaultTime

updateDisplay()

document.getElementById("startPause").innerText = "Start"

}

updateDisplay()

/* BACKGROUNDS */

const backgrounds = {

pomodoro:"url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=2070')",

short:"url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=2070')",

long:"url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2070')"

}

function setMode(mode,minutes,btn){

document.querySelectorAll(".mode-btn")
.forEach(b => b.classList.remove("active"))

btn.classList.add("active")

defaultTime = minutes * 60

resetTimer()

document.body.style.backgroundImage = backgrounds[mode]

}

/* MUSIC PANEL */

let musicOpen = false

function toggleMusic(){

const panel = document.getElementById("spotifyPanel")

if(musicOpen){

panel.style.display = "none"
musicOpen = false

}else{

panel.style.display = "block"
musicOpen = true

}

}

/* PLAYLIST IMPORT */

function loadPlaylist(){

let url = document.getElementById("playlistInput").value

if(!url.includes("spotify.com")){

alert("Paste a valid Spotify playlist link")
return

}

try{

let id = url.split("playlist/")[1].split("?")[0]

let embed =
`https://open.spotify.com/embed/playlist/${id}`

document.getElementById("spotifyPlayer").src = embed

}catch{

alert("Invalid playlist link")

}

}

/* PREPARATION TIMER */

let prepTime = 300
let prepInterval = null

function startPreparation(task){

document.getElementById("prepTask").innerText = task

document.getElementById("intentionScreen").style.display = "none"

document.getElementById("prepScreen").style.display = "flex"

prepTime = 300

updatePrepDisplay()

prepInterval = setInterval(()=>{

if(prepTime > 0){

prepTime--
updatePrepDisplay()

}else{

clearInterval(prepInterval)
enterApp()

}

},1000)

}

function updatePrepDisplay(){

let minutes = Math.floor(prepTime / 60)
let seconds = prepTime % 60

document.getElementById("prepTimer").innerText =
`${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`

}

function enterApp(){

clearInterval(prepInterval)

document.getElementById("prepScreen").style.display = "none"

document.getElementById("app").classList.add("show")

}

</script>

</body>
</html>
